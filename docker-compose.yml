services:
  # VietJet Crawl Service - Main flight data scraping service
  vietjet-crawl-service:
    build: 
      context: ./vietjet-crawl-service
      dockerfile: Dockerfile
    container_name: vietjet-crawl-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Puppeteer configuration for Docker
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    volumes:
      # --- Bind Mounts: For easy local access & editing ---
      - ./vietjet-crawl-service/result:/app/result
      - ./vietjet-crawl-service/screenshot:/app/screenshot
      - ./vietjet-crawl-service/flight-config.json:/app/flight-config.json
      - ./vietjet-crawl-service/airports.csv:/app/airports.csv

      # --- Named Volume: For persistent application state ---
      - crawler_storage:/app/storage

      # Shared memory for Puppeteer (prevents browser crashes)
      - /dev/shm:/dev/shm
    networks:
      - flight_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vietjet-crawl.rule=Host(`localhost`) && PathPrefix(`/api/v1/crawl/vietjet`)"
      - "traefik.http.services.vietjet-crawl.loadbalancer.server.port=3001"

  # PostgreSQL Database Service
  postgres-db:
    image: postgres:14-alpine # Using a specific, lightweight version is good practice
    container_name: flight_postgres_db
    environment:
      - POSTGRES_DB=flight_data
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432" # Maps the container's port 5432 to the host's port 5432
    volumes:
      - postgres_db_data:/var/lib/postgresql/data # Persists database data on the host
    networks:
      - flight_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trungnghia -d flight_data"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway Service (placeholder for future implementation)
  # Uncomment when api-gateway-service is ready
  # api-gateway-service:
  #   build: 
  #     context: ./api-gateway-service
  #     dockerfile: Dockerfile
  #   container_name: api-gateway-service
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NODE_ENV=production
  #     - PORT=3000
  #     - VIETJET_SERVICE_URL=http://vietjet-crawl-service:3001
  #   networks:
  #     - flight_network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.api-gateway.rule=Host(`localhost`)"
  #     - "traefik.http.services.api-gateway.loadbalancer.server.port=3000"

  # BayDep.com Crawl Service
  baydep-crawl-service:
    build:
      context: ./baydep.com-crawl-service
      dockerfile: Dockerfile
    container_name: baydep-crawl-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEAR_EXECUTABLE_PATH=/usr/bin/chromium-browser
    volumes:
      - ./baydep.com-crawl-service/result:/app/result
      - ./baydep.com-crawl-service/screenshot:/app/screenshot
      - ./flight-config.json:/app/flight-config.json
      - ./airports.csv:/app/airports.csv
      - baydep_crawler_storage:/app/storage
      - /dev/shm:/dev/shm
    networks:
      - flight_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/check-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.baydep-crawl.rule=Host(`localhost`) && PathPrefix(`/api/v1/crawl/baydep.com`)"
      - "traefik.http.services.baydep-crawl.loadbalancer.server.port=3002"

# Networks
networks:
  flight_network:
    driver: bridge
    name: flight_network

# Define the named volume used by the service
volumes:
  crawler_storage:
    driver: local
    name: vietjet_crawler_storage
  baydep_crawler_storage:
    driver: local
    name: baydep_crawler_storage
  postgres_db_data: {} # Defines the volume for PostgreSQL data persistence

